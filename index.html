<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>XCV9 Conecta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003f75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XCV9 Conecta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #003f75; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f6f5fa; }
  .abre { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; background: radial-gradient(circle at 70% 20%, #4b3a9e 0%, #003f75 45%, #0a1830 100%); transition: opacity .5s; z-index: 2; }
  .abre img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .abre b { font-size: 24px; } .abre b span { color: #c9b8ff; font-weight: 500; }
  .abre i { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; position: relative; }
  .abre i::after { content: ""; position: absolute; inset: 0; width: 40%; background: #c9b8ff; animation: c 1s ease-in-out infinite; }
  @keyframes c { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .abre.sai { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div class="abre" id="abre"><img src="icons/icon-192.png" alt=""><b>XCV9 <span>Conecta</span></b><i></i></div>
<!-- Endereço publicado do XCV9 Conecta; ?app=1 avisa o sistema que ele abriu como aplicativo -->
<iframe id="app" title="XCV9 Conecta" allow="clipboard-write; fullscreen"
  src="https://script.google.com/macros/s/AKfycbwcKnR-47V2OW1I597c2GjZ6zRicgdJ8lvSZBojTm06HO86caJcPWgidyJ4SRiR_KpQ/exec?app=1"></iframe>
<script>
  document.getElementById('app').addEventListener('load', () => setTimeout(() => document.getElementById('abre').classList.add('sai'), 400));
  setTimeout(() => document.getElementById('abre').classList.add('sai'), 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
